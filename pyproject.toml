[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nextback"
version = "1.0.0"
authors = [
    {name = "HeavenSleep", email = "heavensleep@example.com"},
]
description = "Nextcloud Backup Manager - Comprehensive backup management system for Nextcloud instances"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: System :: Systems Administration",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Unix",
]
keywords = ["nextcloud", "backup", "restore", "upload", "s3", "ftp", "sftp"]
dependencies = [
    "click>=8.0.0",
    "boto3>=1.26.0",
    "paramiko>=3.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
    "build>=0.8.0",
    "twine>=4.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
nextback = "nextback.manager:cli"
nextcloud-backup = "nextback.manager:cli"

[project.urls]
Homepage = "https://github.com/heavensleep/nextback"
Documentation = "https://github.com/heavensleep/nextback/blob/main/README.md"
Repository = "https://github.com/heavensleep/nextback"
"Bug Reports" = "https://github.com/heavensleep/nextback/issues"

[tool.setuptools]
packages = ["nextback", "nextback.scripts"]

[tool.setuptools.package-data]
nextback = [
    "scripts/*.sh",
    "scripts/*.py", 
    "scripts/libs/*.sh",
    "backup.conf.template",
]

[tool.setuptools.data-files]
"share/nextback/templates" = ["config/backup.conf.template"]
"share/doc/nextback" = ["README.md", "LICENSE"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
    ".venv",
    ".mypy_cache",
    ".pytest_cache",
]
